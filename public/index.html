<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus · Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-grid"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<div class="container">

  <!-- ══════════ LOGIN SCREEN ══════════ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">CONNECTUS</span>
      </div>
      <p class="login-sub">Enter the chat dimension</p>

      <div class="input-group">
        <label>USERNAME</label>
        <input id="username" placeholder="Choose your handle..." autocomplete="off" spellcheck="false">
      </div>
      <div class="input-group">
        <label>ROOM</label>
        <input id="room" placeholder="Room name..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') join()">
      </div>
      <div class="input-group">
        <label>PASSWORD (OPTIONAL)</label>
        <input type="password" id="password" placeholder="Leave blank for guest mode..." autocomplete="off" onkeydown="if(event.key==='Enter') join()">
      </div>

      <button class="btn-primary" onclick="join()">
        <span>ENTER CHAT</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- ══════════ CHAT SCREEN ══════════ -->
  <div class="chat-screen hidden" id="chatScreen">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon-sm">⬡</span>
          <span>CONNECTUS</span>
        </div>
        <div class="room-badge" id="roomBadge">—</div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">
          <span>ONLINE</span>
          <span class="online-count" id="onlineCount">0</span>
        </div>
        <ul id="userList"></ul>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="soundToggle" onclick="toggleSound()" title="Toggle sounds">
          <svg id="soundIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <div class="my-info">
          <div class="my-username" id="myUsernameDisplay"></div>
          <div class="my-role-badge" id="myRoleBadge"></div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">

      <!-- Chat Header -->
      <header class="chat-header">
        <div class="chat-header-info">
          <div class="title-row">
            <span class="chat-title" id="roomTitle">Loading...</span>
            <!-- Rename button: shown only to admin via JS -->
            <button class="rename-btn hidden" id="renameBtn" onclick="startRename()" title="Rename room">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <!-- Inline rename input, hidden by default -->
            <div class="rename-form hidden" id="renameForm">
              <input id="renameInput" placeholder="New room name..." maxlength="30" spellcheck="false">
              <button class="rename-save" onclick="confirmRename()">✓</button>
              <button class="rename-cancel" onclick="cancelRename()">✕</button>
            </div>
          </div>
          <span class="chat-status">
            <span class="status-dot"></span>
            <span id="typingStatus">All quiet</span>
          </span>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn-sm" title="Room info">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="messages">
        <div class="messages-start">
          <div class="start-icon">⬡</div>
          <p>Welcome to the room. Be excellent to each other.</p>
        </div>
      </div>

      <!-- Scroll to bottom -->
      <button class="scroll-btn hidden" id="scrollBtn" onclick="scrollToBottom()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        <span id="scrollBtnCount"></span>
      </button>

      <!-- Emoji Panel -->
      <div class="emoji-panel hidden" id="emojiPanel">
        <div class="emoji-grid">
          😄 😂 🥹 😍 🤔 😤 🔥 💯 👀 🙏 💀 🤯 🎉 ❤️ 💪 🤝 😎 🥲 😭 🚀 💡 ✨ 👍 👎 🫡 😈 🤖 🌊 🎮 🍕
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <button class="emoji-toggle" id="emojiToggle" onclick="toggleEmoji()" title="Emoji">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <div class="input-wrap">
          <input id="messageInput" placeholder="Message the room..." autocomplete="off" maxlength="500">
          <span class="char-count" id="charCount"></span>
        </div>
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach media">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" hidden accept="image/*,video/*">
        <button class="send-btn" onclick="send()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </main>

    <!-- Private Chat Overlay -->
    <div class="private-overlay hidden" id="privateBox">
      <div class="private-card">
        <div class="private-header">
          <div class="private-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span id="privateTitle">Private Message</span>
          </div>
          <button class="close-btn" onclick="closePrivate()">✕</button>
        </div>

        <div id="privateMessages" class="messages private-messages"></div>
        <div class="private-typing" id="privateTypingStatus"></div>

        <div class="input-area private-input-area">
          <div class="input-wrap">
            <input id="privateInput" placeholder="Encrypted channel..." autocomplete="off">
          </div>
          <button class="attach-btn" onclick="document.getElementById('privateFile').click()" title="Attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="privateFile" hidden accept="image/*,video/*">
          <button class="send-btn" onclick="sendPrivate()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div><!-- end chat-screen -->
</div><!-- end container -->

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Mod Action Menu (created once, repositioned by JS) -->
<div class="mod-menu hidden" id="modMenu"></div>

<!-- Timeout input popup -->
<div class="timeout-popup hidden" id="timeoutPopup">
  <div class="timeout-card">
    <div class="timeout-title">⏱ Set Timeout Duration</div>
    <div class="timeout-subtitle">Seconds (10–600)</div>
    <input type="number" id="timeoutInput" min="10" max="600" value="60" placeholder="60">
    <div class="timeout-actions">
      <button class="timeout-cancel" onclick="closeTimeoutPopup()">Cancel</button>
      <button class="timeout-confirm" onclick="confirmTimeout()">Apply</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
